# =====================================================================
# cloe-former - environment for the former CLOE code (github.com/cloe-org/cloe)
# ---------------------------------------------------------------------
# Used by time_comparison_Euclid_DR3.ipynb (former-CLOE section), which runs
# CLOE in a subprocess with this env's python. Pins follow cloe/environment.yml
# (python 3.9, numpy 1.23.5, camb 1.5.0, fast-pt 3.1.1, cobaya 3.3.1) minus the
# pieces not needed for a CAMB + TATT + non-linear-bias 3x2pt evaluation
# (tensorflow / baccoemu / BCemu / euclidemu2 / pyhmcode emulators, pyqt GUI,
# sphinx docs, pytest, cosmosis).
#
#   mamba env create -p env/cloe-former -f env/cloe-former-env-linux.yaml
#   env/cloe-former/bin/python -m pip install -e cloe --no-deps
# =====================================================================
name: cloe-former
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.9
  - pip
  - setuptools
  - astropy=5.3
  - matplotlib=3.7.1
  - numpy=1.23.5
  - scipy=1.10.1
  - seaborn=0.12.2
  - pandas
  - pyyaml
  - fast-pt=3.1.1
  - camb=1.5.0
  - gsl=2.7
  - fitsio
  - pip:
      - cobaya==3.3.1
      - deepdish==0.3.7
      - euclidlib==0.0.5
      - getdist
