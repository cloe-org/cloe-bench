; CosmoSIS pipeline for time_comparison_Euclid_DR3.ipynb
; Full photometric 3x2pt with TATT intrinsic alignments + non-linear galaxy bias
; (pt_type = oneloop_eul_bk), 13 tomographic bins (nzTabSPV3.fits, Euclid DR3-like).
;
;   GG = nlgal-nlgal                                   (91 pairs)
;   GE = nlgal-shear + lingal-intrinsic                 (169 pairs)
;   EE = shear-shear + shear-intrinsic (GI + IG) + II   (91 pairs)
;
; The GE / EE sums are done by add_intrinsic. The galaxy-intrinsic term uses the linear
; bias only (b_lin_bin{i} = b1), the same convention as cloelib and pyccl.
; CSL_DIR, INI_DIR are set by the notebook (environment variables); the notebook also
; writes values_3x2pt_tatt_nlbias.ini and nz_spv3_13bins.txt, and overrides
; project_2d's n_ell_logspaced for each ell grid.

[runtime]
sampler = test
verbosity = silent

[test]
save_dir =
fatal_errors = T

[pipeline]
modules = consistency camb load_nz_lens load_nz_source fast_pt tatt project_2d add_intrinsic
values = %(INI_DIR)s/values_3x2pt_tatt_nlbias.ini
timing = F
debug = F

[DEFAULT]
CSL_DIR = ${CSL_DIR}
INI_DIR = ${INI_DIR}

[consistency]
file = %(CSL_DIR)s/utility/consistency/consistency_interface.py

[camb]
file = %(CSL_DIR)s/boltzmann/camb/camb_interface.py
mode = power
lmax = 2500
feedback = 0
nonlinear = pk
halofit_version = mead2020
kmax = 500.0
kmax_extrapolate = 500.0
nk = 400
zmin = 0.0
zmax = 3.01
nz = 151

[load_nz_lens]
file = %(CSL_DIR)s/number_density/load_nz/load_nz.py
filepath = %(INI_DIR)s/nz_spv3_13bins.txt
histogram = F
output_section = nz_lens

[load_nz_source]
file = %(CSL_DIR)s/number_density/load_nz/load_nz.py
filepath = %(INI_DIR)s/nz_spv3_13bins.txt
histogram = F
output_section = nz_source

; FAST-PT IA kernels (P_ta_*, P_tt_*, P_mix_*) for the tatt module.
; always_init = T rebuilds the FASTPT object on every call, as a fresh cloelib
; PBJTATTLoopComputer and a fresh pyccl EulerianPTCalculator do.
[fast_pt]
file = %(CSL_DIR)s/structure/fast_pt/fast_pt_interface.py
do_ia = T
always_init = T
verbose = F

[tatt]
file = %(CSL_DIR)s/intrinsic_alignments/tatt/tatt_interface.py
ia_model = tatt
sub_lowk = F
do_galaxy_intrinsic = F

[project_2d]
file = %(CSL_DIR)s/structure/projection/project_2d.py
ell_min_logspaced = 2.0
ell_max_logspaced = 2999.0
n_ell_logspaced = 32
nlgal-nlgal = lens-lens
nlgal-shear = lens-source
lingal-intrinsic = lens-source
shear-shear = source-source
shear-intrinsic = source-source
intrinsic-intrinsic = source-source
lin_bias_prefix = b_lin_bin
verbose = F
get_kernel_peaks = F

[add_intrinsic]
file = %(CSL_DIR)s/shear/add_intrinsic/add_intrinsic.py
shear-shear = T
position-shear = T
