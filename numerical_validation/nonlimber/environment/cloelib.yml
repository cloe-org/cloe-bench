# cloelib (beyond-Limber branch), CAMB for the shared inputs, the plots, and
# the driver of Blast (numpy only; Blast itself runs in Julia).
# cloelib is installed by `nonlimber_validation.py setup` from [setup] cloelib
# of the config (a git URL with the commit to validate, or a local path).
name: nlv-cloelib
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - numpy=2.4
  - scipy=1.17
  - matplotlib=3.10
  - pip:
      - camb==1.6.6
      - jax==0.9.2
      - interpax==0.3.13
